name: Run Tests + Upload Coverage

on:
  pull_request:
    branches: [ "*" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 2      # <--------- This part is very important (fetch-depth must be 2, or deeper)
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
          php-version: 8.2
          coverage: pcov
    - name: Install Dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs

    - name: Run tests
      run: php -d pcov.enabled=1 vendor/bin/phpunit --coverage-clover=build/logs/clover.xml tests

    - uses: getOtterWise/github-action@v1
      with:
        token: ${{ secrets.OTTERWISE_TOKEN }}
